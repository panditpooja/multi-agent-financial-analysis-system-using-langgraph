<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial AI Multi-Agent System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message.assistant {
            display: flex;
            justify-content: flex-start;
        }

        .message-content {
            display: inline-block;
            max-width: 75%;
            padding: 15px 20px;
            border-radius: 18px;
            word-wrap: break-word;
            text-align: left;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.assistant .message-content h3 {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message.assistant .message-content p,
        .message.assistant .message-content div {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }

        .message.assistant .message-content pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            margin: 10px 0;
        }

        .message.assistant .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 14px;
        }

        .message.assistant .message-content table th,
        .message.assistant .message-content table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .message.assistant .message-content table th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .input-container {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-form {
            display: flex;
            gap: 12px;
        }

        .input-field {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-button {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px 20px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #c33;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #667eea;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* Markdown styling */
        .message-content strong {
            font-weight: 600;
        }

        .message-content em {
            font-style: italic;
        }

        .message-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .message-content ul,
        .message-content ol {
            margin: 10px 0;
            padding-left: 25px;
        }

        .message-content li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Financial AI Multi-Agent System</h1>
            <p>Ask questions about stocks, financial data, and get visualizations</p>
            <div style="margin-top: 10px;">
                <a href="/metrics/" style="color: white; text-decoration: none; font-size: 14px; opacity: 0.9;">📊 View Metrics Dashboard</a>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state" id="emptyState">
                <h3>Welcome! 👋</h3>
                <p>Ask me anything about stocks, financial data, or request visualizations.</p>
                <p style="margin-top: 10px; font-size: 14px;">Try: "What was the last closing stock price of AAPL?"</p>
            </div>
        </div>

        <div class="loading" id="loadingIndicator">
            <div class="loading-spinner"></div>
            <p style="margin-top: 10px;">Processing your query...</p>
        </div>

        <div class="input-container">
            <form class="input-form" id="queryForm" onsubmit="submitQuery(event)">
                <input 
                    type="text" 
                    class="input-field" 
                    id="queryInput" 
                    placeholder="Ask a question about stocks or financial data..."
                    autocomplete="off"
                    required
                >
                <button type="submit" class="send-button" id="sendButton">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        const threadId = '{{ thread_id }}';
        let isLoading = false;

        function submitQuery(event) {
            event.preventDefault();
            
            if (isLoading) return;
            
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            
            if (!query) return;
            
            // Hide empty state
            document.getElementById('emptyState').style.display = 'none';
            
            // Add user message
            addMessage('user', query);
            
            // Clear input
            input.value = '';
            
            // Show loading
            setLoading(true);
            
            // Send request with timeout (5 minutes for complex queries like plot generation)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000); // 5 minute timeout
            
            fetch('/query/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    query: query,
                    thread_id: threadId
                }),
                signal: controller.signal
            })
            .then(response => {
                clearTimeout(timeoutId);
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || `HTTP ${response.status}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log('Response received:', data); // Debug logging
                
                if (data && data.success) {
                    addMessage('assistant', data.response);
                    // If there's a plot, display it
                    if (data.plot_path) {
                        console.log('Plot path received:', data.plot_path); // Debug logging
                        const plotImg = document.createElement('img');
                        // Add cache-busting timestamp if not already present
                        let plotUrl = data.plot_path;
                        if (!plotUrl.includes('?t=')) {
                            plotUrl += '?t=' + Date.now();
                        }
                        plotImg.src = plotUrl;
                        plotImg.style.maxWidth = '100%';
                        plotImg.style.height = 'auto';
                        plotImg.style.marginTop = '10px';
                        plotImg.style.border = '1px solid #ddd';
                        plotImg.style.borderRadius = '5px';
                        plotImg.alt = 'Generated Plot';
                        // Force reload by setting cache control
                        plotImg.setAttribute('loading', 'eager');
                        // Handle image load errors
                        plotImg.onerror = function() {
                            console.error('Failed to load plot image:', plotUrl);
                            this.style.display = 'none';
                        };
                        plotImg.onload = function() {
                            console.log('Plot image loaded successfully');
                        };
                        // Add to the last message
                        const messages = document.getElementById('chatContainer').children;
                        if (messages.length > 0) {
                            const lastMessage = messages[messages.length - 1];
                            const contentDiv = lastMessage.querySelector('.message-content');
                            if (contentDiv) {
                                contentDiv.appendChild(plotImg);
                            } else {
                                console.error('Could not find message-content div');
                            }
                        } else {
                            console.error('No messages found in chat container');
                        }
                    }
                } else {
                    addMessage('assistant', `Error: ${data?.error || 'Unknown error'}`, true);
                }
            })
            .catch(error => {
                console.error('Fetch error:', error); // Debug logging
                if (error.name === 'AbortError') {
                    addMessage('assistant', 'Error: Request timed out after 5 minutes. Complex queries like plot generation may take longer. The plot may have been generated successfully - please check if a plot window opened. You can try refreshing the page and asking again.', true);
                } else {
                    addMessage('assistant', `Error: ${error.message || 'Failed to process query'}`, true);
                }
            })
            .finally(() => {
                clearTimeout(timeoutId);
                setLoading(false);
                console.log('Request completed, loading state cleared');
            });
        }

        function addMessage(type, content, isError = false) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (isError) {
                contentDiv.className += ' error-message';
                contentDiv.textContent = content;
            } else if (type === 'user') {
                contentDiv.textContent = content;
            } else {
                // Parse markdown-like formatting
                contentDiv.innerHTML = formatResponse(content);
            }
            
            messageDiv.appendChild(contentDiv);
            container.appendChild(messageDiv);
            
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function formatResponse(text) {
            // Convert markdown-like formatting to HTML
            let html = text;
            
            // Bold text **text**
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Headers ### Header
            html = html.replace(/### (.*?)(\n|$)/g, '<h3>$1</h3>');
            html = html.replace(/## (.*?)(\n|$)/g, '<h2>$1</h2>');
            html = html.replace(/# (.*?)(\n|$)/g, '<h1>$1</h1>');
            
            // Code blocks ```
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            
            // Inline code `code`
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Line breaks
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');
            
            // Wrap in paragraph if not already wrapped
            if (!html.startsWith('<')) {
                html = '<p>' + html + '</p>';
            }
            
            return html;
        }

        function setLoading(loading) {
            isLoading = loading;
            const loadingIndicator = document.getElementById('loadingIndicator');
            const sendButton = document.getElementById('sendButton');
            const queryInput = document.getElementById('queryInput');
            
            if (loading) {
                loadingIndicator.classList.add('active');
                sendButton.disabled = true;
                queryInput.disabled = true;
            } else {
                loadingIndicator.classList.remove('active');
                sendButton.disabled = false;
                queryInput.disabled = false;
                queryInput.focus();
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Focus input on load
        document.getElementById('queryInput').focus();
    </script>
</body>
</html>
